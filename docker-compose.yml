version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-inkwell_jwt_secret_key_2026}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@inkwell.app}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
    volumes:
      - inkwell_data:/app/.data

volumes:
  inkwell_data:
