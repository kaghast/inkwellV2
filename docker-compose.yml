version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Leave unset to auto-generate a random secret persisted in the data volume
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@inkwell.app}
      # Leave unset to generate a one-time random admin password (printed in logs)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Comma separated extra origins allowed for credentialed CORS requests
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - inkwell_data:/app/.data

volumes:
  inkwell_data:
